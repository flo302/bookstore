<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: Georgia, serif; }
        .register-box { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; }
        #register-btn { border-radius: 30px; }
        .register-box input[type="password"] { border-radius: 30px; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom border-dark py-3">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <div class="bg-black rounded-1 me-2" style="width: 35px; height: 35px;"></div>
                <span style="line-height: 1; font-size: 14px;">Название<br>магазина</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
              <a class="nav-link me-4 text-dark fw-bold" href="index.html">Главная</a>
              <a class="nav-link me-4 text-dark fw-bold" href="catalog.html">Каталог</a>
              <a class="nav-link me-4 text-dark fw-bold" href="cart.html">Корзина</a>
              <a href="login.html" class="text-dark"><i class="bi bi-person fs-5"></i></a>
            </div>
          </div>
        </nav>
    </header>

    <!-- Измененный фон: #d1d5db -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-5" style="background-color: #d1d5db;">
        <div class="register-box shadow">
            <h1 class="fw-bold text-center mb-4">Регистрация</h1>
            <form action="profile.html">
                <div class="row mb-3">
                    <div class="col-6"><input type="text" class="form-control" name="firstname" placeholder="Имя" required></div>
                    <div class="col-6"><input type="text" class="form-control" name="lastname" placeholder="Фамилия" required></div>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" name="email" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" placeholder="Пароль" required>
                </div>
                <div class="mb-4">
                    <input type="password" class="form-control" name="confirm_password" placeholder="Повтор пароля" required>
                </div>
                <button type="submit" id="register-btn" class="btn btn-dark w-100 py-3 fw-bold">Зарегистрироваться</button>
            </form>
            <div class="text-center mt-4">
                <a href="login.html" class="text-dark">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </main>

    <footer class="bg-secondary-subtle border-top border-dark p-3 text-center">
        <a href="admin.html" class="btn btn-dark fw-bold rounded-3 px-4 py-2">Административная панель</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
