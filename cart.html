<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* === ЗАДАНИЕ ЛАБЫ: СЕЛЕКТОРЫ === */
        /* 1. Селектор по тегу */
        body { font-family: Georgia, serif; }
        /* 2. Селектор по классу */
        .cart-item { background-color: #000; color: #fff; border-radius: 15px; }
        .cart-summary { background-color: #fff; border-radius: 20px; }
        /* 3. Селектор по ID */
        #cart-title { font-size: 42px; font-weight: bold; }
        /* 4. Селектор потомка */
        .cart-summary .promo-input { border-radius: 20px; border: 1px solid #ccc; padding: 8px 15px; }
        .quantity-controls input { width: 40px; text-align: center; border: none; background: transparent; color: white; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Шапка -->
    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom border-dark py-3">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <div class="bg-black rounded-1 me-2" style="width: 35px; height: 35px;"></div>
                <span style="line-height: 1; font-size: 14px;">Название<br>магазина</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
              <a class="nav-link me-4 text-dark fw-bold" href="index.html">Главная</a>
              <a class="nav-link me-4 text-dark fw-bold" href="catalog.html">Каталог</a>
              <a class="nav-link me-4 text-dark fw-bold" href="cart.html">Корзина</a>
              <a href="login.html" class="text-dark"><i class="bi bi-person fs-5"></i></a>
            </div>
          </div>
        </nav>
    </header>

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Основной контент -->
    <main class="flex-grow-1" style="background-color: #d1d5db;">
        <div class="container py-5">
            <h1 id="cart-title" class="mb-4 text-dark">Ваша корзина</h1>
            
            <div class="row">
                
                <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Список товаров -->
                <section class="col-lg-8 mb-4">
                    
                    <!-- Карточка товара 1 -->
                    <article class="cart-item d-flex align-items-center p-3 mb-4">
                        <div class="bg-white rounded-3 me-4 flex-shrink-0" style="width: 80px; height: 120px;"></div>
                        <div class="flex-grow-1">
                            <h5 class="fw-bold mb-1" style="font-size: 16px;">Название: жанр</h5>
                            <p class="mb-0 text-white-50" style="font-size: 14px;">Автор</p>
                        </div>
                        
                        <!-- ФОРМА ИЗМЕНЕНИЯ КОЛИЧЕСТВА -->
                        <div class="d-flex align-items-center mx-4 quantity-controls border border-light rounded-pill px-2 py-1">
                            <button class="btn btn-sm text-white p-0 px-2" type="button">-</button>
                            <input type="text" value="1" readonly>
                            <button class="btn btn-sm text-white p-0 px-2" type="button">+</button>
                        </div>

                        <div class="fw-bold me-4" style="font-size: 16px;">Цена</div>
                        <button class="btn text-white p-0"><i class="bi bi-x-lg"></i></button>
                    </article>

                    <!-- Карточка товара 2 -->
                    <article class="cart-item d-flex align-items-center p-3 mb-4">
                        <div class="bg-white rounded-3 me-4 flex-shrink-0" style="width: 80px; height: 120px;"></div>
                        <div class="flex-grow-1">
                            <h5 class="fw-bold mb-1" style="font-size: 16px;">Название: жанр</h5>
                            <p class="mb-0 text-white-50" style="font-size: 14px;">Автор</p>
                        </div>
                        
                        <div class="d-flex align-items-center mx-4 quantity-controls border border-light rounded-pill px-2 py-1">
                            <button class="btn btn-sm text-white p-0 px-2" type="button">-</button>
                            <input type="text" value="1" readonly>
                            <button class="btn btn-sm text-white p-0 px-2" type="button">+</button>
                        </div>

                        <div class="fw-bold me-4" style="font-size: 16px;">Цена</div>
                        <button class="btn text-white p-0"><i class="bi bi-x-lg"></i></button>
                    </article>

                </section>

                <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Блок итогов (Форма) -->
                <aside class="col-lg-4">
                    <div class="cart-summary p-4 mb-4">
                        
                        <!-- ФОРМА ПРОМОКОДА -->
                        <form action="cart.html" method="GET" class="d-flex mb-4">
                            <input type="text" name="promo" class="form-control promo-input me-2" placeholder="Промокод">
                            <button type="submit" class="btn btn-dark rounded-pill px-4">Применить</button>
                        </form>

                        <div class="fs-5 mb-0">
                            Общая сумма: <span class="fw-bold">**** ₽</span>
                        </div>
                    </div>

                    <!-- Кнопка перехода к оформлению -->
                    <a href="checkout.html" class="btn btn-dark w-100 rounded-pill py-3 fs-5 d-flex justify-content-between align-items-center px-4">
                        <span>Оформить заказ</span>
                        <i class="bi bi-arrow-right"></i>
                    </a>
                </aside>

            </div>
        </div>
    </main>

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Подвал -->
    <footer class="bg-secondary-subtle border-top border-dark p-3 text-center">
        <a href="admin.html" class="btn btn-dark fw-bold rounded-3 px-4 py-2">Административная панель</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
