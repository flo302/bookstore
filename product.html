<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка книги - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* === ЗАДАНИЕ ЛАБЫ: СЕЛЕКТОРЫ === */
        /* 1. Селектор по тегу */
        body { font-family: Georgia, serif; }
        /* 2. Селектор по классу */
        .cover-block { background-color: #888888; color: white; border-radius: 15px; }
        .description-block { background-color: #000000; color: white; border-radius: 15px; }
        /* 3. Селектор по ID */
        #main-container { background-color: #d1d5db; }
        /* 4. Селектор потомка */
        .action-form button { background-color: #000; color: white; border-radius: 10px; border: none; padding: 15px; font-size: 18px; }
        .action-form button:hover { background-color: #333; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Шапка -->
    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom border-dark py-3">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <div class="bg-black rounded-1 me-2" style="width: 35px; height: 35px;"></div>
                <span style="line-height: 1; font-size: 14px;">Название<br>магазина</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
              <a class="nav-link me-4 text-dark fw-bold" href="index.html">Главная</a>
              <a class="nav-link me-4 text-dark fw-bold" href="catalog.html">Каталог</a>
              <a class="nav-link me-4 text-dark fw-bold" href="cart.html">Корзина</a>
              <a href="login.html" class="text-dark"><i class="bi bi-person fs-5"></i></a>
            </div>
          </div>
        </nav>
    </header>

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Основной контент -->
    <main id="main-container" class="flex-grow-1 py-5">
        <div class="container">
            
            <div class="row g-4 mb-4">
                <!-- Левая часть: Серая обложка -->
                <div class="col-md-4">
                    <div class="cover-block d-flex flex-column justify-content-center p-4 shadow-sm" style="height: 400px;">
                        <h2 class="fw-bold mb-0">Обложка</h2>
                        <h2 class="fw-bold mb-0">книги</h2>
                    </div>
                </div>

                <!-- Правая часть: Черное описание -->
                <div class="col-md-8">
                    <div class="description-block d-flex align-items-center justify-content-center shadow-sm" style="height: 400px;">
                        <h3 class="fw-bold mb-0">Описание книги</h3>
                    </div>
                </div>
            </div>

            <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Форма действий (Цена и В корзину) -->
            <section class="row g-4 justify-content-between">
                <div class="col-md-6">
                    <div class="bg-black text-white text-center py-3 rounded-3 fs-4">
                        600 ₽
                    </div>
                </div>
                
                <div class="col-md-6">
                    <!-- ФОРМА ДОБАВЛЕНИЯ В КОРЗИНУ -->
                    <form class="action-form" action="cart.html">
                        <button type="submit" class="w-100">В корзину</button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Подвал -->
    <footer class="bg-secondary-subtle border-top border-dark p-3 text-center">
        <a href="admin.html" class="btn btn-dark fw-bold rounded-3 px-4 py-2">Административная панель</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
