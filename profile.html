<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: Georgia, serif; }
        .sidebar-btn { background-color: white; border: 1px solid #ccc; border-radius: 20px; width: 100%; text-align: center; padding: 8px 0; margin-bottom: 15px; text-decoration: none; color: black; display: block; }
        .sidebar-btn:hover { background-color: #f0f0f0; color: black; }
        .info-card { background-color: white; border-radius: 20px; padding: 30px; height: 100%; }
        .right-panel { background-color: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        #profile-title { font-size: 42px; font-weight: bold; }
        .profile-form input { border-radius: 20px; border: 1px solid #aaa; padding: 10px 15px; }
        .logout-btn { background-color: black; color: white; border-radius: 20px; width: 100%; text-align: center; padding: 8px 0; text-decoration: none; display: block; margin-top: auto;}
        .logout-btn:hover { background-color: #333; color: white; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom border-dark py-3">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <div class="bg-black rounded-1 me-2" style="width: 35px; height: 35px;"></div>
                <span style="line-height: 1; font-size: 16px;">Книжный магазин</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
              <a class="nav-link me-4 text-dark fw-bold" href="index.html">Главная</a>
              <a class="nav-link me-4 text-dark fw-bold" href="catalog.html">Каталог</a>
              <a class="nav-link me-4 text-dark fw-bold" href="cart.html">Корзина</a>
              <a href="login.html" class="text-dark"><i class="bi bi-person fs-5"></i></a>
            </div>
          </div>
        </nav>
    </header>

    <!-- Измененный фон: #d1d5db -->
    <main class="flex-grow-1" style="background-color: #d1d5db;">
        <div class="container py-5">
            <h1 id="profile-title" class="mb-4 text-dark">Личный кабинет</h1>
            
            <div class="row g-4">
                <aside class="col-md-3 d-flex flex-column">
                    <a href="#" class="sidebar-btn">Личные данные</a>
                    <a href="#" class="sidebar-btn">История заказов</a>
                    <a href="#" class="sidebar-btn mb-5">Избранное</a>
                    <a href="login.html" class="logout-btn mt-auto">Выход</a>
                </aside>

                <section class="col-md-6">
                    <div class="info-card">
                        <div class="d-flex align-items-center mb-4">
                            <div class="border border-dark rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
                                <i class="bi bi-person fs-4"></i>
                            </div>
                            <h4 class="mb-0 fw-normal">Имя Фамилия</h4>
                        </div>

                        <form class="profile-form" action="profile.html">
                            <div class="mb-3">
                                <label class="form-label mb-1">Имя</label>
                                <input type="text" class="form-control" name="name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label mb-1">Фамилия</label>
                                <input type="text" class="form-control" name="surname">
                            </div>
                            <div class="mb-3">
                                <label class="form-label mb-1">E-mail</label>
                                <input type="email" class="form-control" name="email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label mb-1">Телефон</label>
                                <input type="tel" class="form-control" name="phone">
                            </div>
                            <div class="mb-3">
                                <label class="form-label mb-1">Дата рождения</label>
                                <input type="date" class="form-control" name="birthdate">
                            </div>
                        </form>
                    </div>
                </section>

                <aside class="col-md-3">
                    <div class="right-panel" style="height: 180px;">
                        <h5 class="fw-normal">Адрес доставки</h5>
                    </div>
                    <div class="right-panel" style="height: 180px;">
                        <h5 class="fw-normal">Последний заказ</h5>
                    </div>
                    <div class="right-panel" style="height: 180px;">
                        <h5 class="fw-normal">Бонусы</h5>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="bg-secondary-subtle border-top border-dark p-3 text-center">
        <a href="admin.html" class="btn btn-dark fw-bold rounded-3 px-4 py-2">Административная панель</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
