<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* 1. Селектор по тегу */
        body { font-family: Georgia, serif; }
        /* 2. Селектор по классу */
        .hero-title { font-size: 54px; line-height: 1.1; font-weight: bold; }
        /* 3. Селектор по ID */
        #hero-section { background-color: #d1d5db; } /* Серый фон как на макете */
        /* 4. Селектор потомка */
        .book-card .price { font-weight: bold; font-size: 16px; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Шапка -->
    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom border-dark py-3">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <div class="bg-black rounded-1 me-2" style="width: 35px; height: 35px;"></div>
                <span style="line-height: 1; font-size: 14px;">Название<br>магазина</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
              <a class="nav-link me-4 text-dark fw-bold" href="index.html">Главная</a>
              <a class="nav-link me-4 text-dark fw-bold" href="catalog.html">Каталог</a>
              <a class="nav-link me-4 text-dark fw-bold" href="cart.html">Корзина</a>
              <a href="login.html" class="text-dark"><i class="bi bi-person fs-5"></i></a>
            </div>
          </div>
        </nav>
    </header>

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Основной контент -->
    <main class="flex-grow-1">

        <!-- Секция 1: Промо-блок (Слоган + Обложка) -->
        <section id="hero-section" class="py-5 px-4">
            <div class="container">
                <div class="row align-items-center">
                    <!-- Левая часть: Текст -->
                    <div class="col-md-6 mb-4 mb-md-0">
                        <h1 class="hero-title mb-4">Слоган</h1>
                        <p class="fs-5 fw-bold text-dark">Надпись</p>
                    </div>
                    <!-- Правая часть: Черная обложка -->
                    <div class="col-md-6">
                        <div class="bg-black text-white rounded-4 d-flex align-items-center justify-content-center shadow" style="height: 300px; font-size: 48px;">
                            Обложка
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Секция 2: Популярное -->
        <section class="container py-5">
            <h2 class="fw-bold mb-4">Популярное</h2>
            
            <div class="row g-4">
                
                <!-- Карточка товара 1 -->
                <div class="col-md-6 col-lg-3">
                    <article class="book-card bg-white border rounded-3 p-3 h-100 d-flex">
                        <!-- Обложка слева -->
                        <div class="bg-black text-white rounded-2 d-flex align-items-center justify-content-center me-3" style="width: 80px; height: 120px; font-size: 10px; text-align: center; padding: 5px;">
                            Обложка книги
                        </div>
                        <!-- Текст справа -->
                        <div class="d-flex flex-column justify-content-between flex-grow-1">
                            <div>
                                <h6 class="fw-bold mb-1" style="font-size: 14px;">Название книги</h6>
                                <p class="text-muted mb-0" style="font-size: 12px;">Автор</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-end mt-2">
                                <span class="price">цена</span>
                                <div class="bg-black rounded-1" style="width: 15px; height: 15px;"></div>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- Карточка товара 2 -->
                <div class="col-md-6 col-lg-3">
                    <article class="book-card bg-white border rounded-3 p-3 h-100 d-flex">
                        <div class="bg-black text-white rounded-2 d-flex align-items-center justify-content-center me-3" style="width: 80px; height: 120px; font-size: 10px; text-align: center; padding: 5px;">
                            Обложка книги
                        </div>
                        <div class="d-flex flex-column justify-content-between flex-grow-1">
                            <div>
                                <h6 class="fw-bold mb-1" style="font-size: 14px;">Название книги</h6>
                                <p class="text-muted mb-0" style="font-size: 12px;">Автор</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-end mt-2">
                                <span class="price">цена</span>
                                <div class="bg-black rounded-1" style="width: 15px; height: 15px;"></div>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- Карточка товара 3 -->
                <div class="col-md-6 col-lg-3">
                    <article class="book-card bg-white border rounded-3 p-3 h-100 d-flex">
                        <div class="bg-black text-white rounded-2 d-flex align-items-center justify-content-center me-3" style="width: 80px; height: 120px; font-size: 10px; text-align: center; padding: 5px;">
                            Обложка книги
                        </div>
                        <div class="d-flex flex-column justify-content-between flex-grow-1">
                            <div>
                                <h6 class="fw-bold mb-1" style="font-size: 14px;">Название книги</h6>
                                <p class="text-muted mb-0" style="font-size: 12px;">Автор</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-end mt-2">
                                <span class="price">цена</span>
                                <div class="bg-black rounded-1" style="width: 15px; height: 15px;"></div>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- Карточка товара 4 -->
                <div class="col-md-6 col-lg-3">
                    <article class="book-card bg-white border rounded-3 p-3 h-100 d-flex">
                        <div class="bg-black text-white rounded-2 d-flex align-items-center justify-content-center me-3" style="width: 80px; height: 120px; font-size: 10px; text-align: center; padding: 5px;">
                            Обложка книги
                        </div>
                        <div class="d-flex flex-column justify-content-between flex-grow-1">
                            <div>
                                <h6 class="fw-bold mb-1" style="font-size: 14px;">Название книги</h6>
                                <p class="text-muted mb-0" style="font-size: 12px;">Автор</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-end mt-2">
                                <span class="price">цена</span>
                                <div class="bg-black rounded-1" style="width: 15px; height: 15px;"></div>
                            </div>
                        </div>
                    </article>
                </div>

            </div>
        </section>

    </main>

    <!-- СЕМАНТИЧЕСКАЯ СТРУКТУРА: Подвал -->
    <footer class="bg-secondary-subtle border-top border-dark p-3 text-center">
        <a href="admin.html" class="btn btn-dark fw-bold rounded-3 px-4 py-2">Административная панель</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
