<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: Georgia, serif; }
        #order-title { color: black; text-align: center; margin-bottom: 40px; }
        .checkout-form { background: white; padding: 30px; border-radius: 20px; max-width: 600px; margin: 0 auto; }
        .checkout-form input[type="radio"] { margin-right: 10px; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom border-dark py-3">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <div class="bg-black rounded-1 me-2" style="width: 35px; height: 35px;"></div>
                <span style="line-height: 1; font-size: 14px;">Название<br>магазина</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
              <a class="nav-link me-4 text-dark fw-bold" href="index.html">Главная</a>
              <a class="nav-link me-4 text-dark fw-bold" href="catalog.html">Каталог</a>
              <a class="nav-link me-4 text-dark fw-bold" href="cart.html">Корзина</a>
              <a href="login.html" class="text-dark"><i class="bi bi-person fs-5"></i></a>
            </div>
          </div>
        </nav>
    </header>

    <!-- Измененный фон: #d1d5db -->
    <main class="flex-grow-1 p-5" style="background-color: #d1d5db;">
        <h1 id="order-title" class="fw-bold">Оформление заказа</h1>
        
        <div class="checkout-form shadow">
            <form action="profile.html">
                <h4 class="mb-3">Адрес доставки:</h4>
                <div class="mb-3">
                    <input type="text" class="form-control" name="address" placeholder="Город, улица, дом..." required>
                </div>

                <h4 class="mt-4 mb-3">Способ оплаты:</h4>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="payment" id="pay-card" checked>
                    <label class="form-check-label" for="pay-card">Картой онлайн</label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" name="payment" id="pay-cash">
                    <label class="form-check-label" for="pay-cash">При получении</label>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold">Подтвердить заказ</button>
            </form>
        </div>
    </main>

    <footer class="bg-secondary-subtle border-top border-dark p-3 text-center">
        <a href="admin.html" class="btn btn-dark fw-bold rounded-3 px-4 py-2">Административная панель</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
